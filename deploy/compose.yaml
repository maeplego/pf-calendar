services:
  calendar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - calendar-pg:/var/lib/postgresql/data

  calendar-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      CALENDAR_HTTP_PORT: "8095"
      CALENDAR_DATABASE_URL: ${CALENDAR_DATABASE_URL:-postgres://calendar:calendar@calendar-db:5432/calendar}
      CALENDAR_DEV_AUTH: ${CALENDAR_DEV_AUTH:-true}
      CALENDAR_CORS_ORIGIN: ${CALENDAR_CORS_ORIGIN:-http://localhost:3005}
      CALENDAR_INTERNAL_TOKEN: ${CALENDAR_INTERNAL_TOKEN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_BASE: ${OIDC_INTERNAL_BASE:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    ports:
      - "8095:8095"
    depends_on:
      calendar-db:
        condition: service_healthy

  calendar-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CALENDAR_API_URL: ${NEXT_PUBLIC_CALENDAR_API_URL:-http://localhost:8095}
    environment:
      CALENDAR_API_URL: ${CALENDAR_API_URL:-http://calendar-api:8095}
      NEXT_PUBLIC_CALENDAR_API_URL: ${NEXT_PUBLIC_CALENDAR_API_URL:-http://localhost:8095}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_BASE: ${OIDC_INTERNAL_BASE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "3005:3005"
    depends_on:
      - calendar-api

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  calendar-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      CALENDAR_DATABASE_URL: ${CALENDAR_DATABASE_URL:-postgres://calendar:calendar@calendar-db:5432/calendar}
      CALENDAR_SMTP_HOST: mailhog
      CALENDAR_SMTP_PORT: "1025"
      CALENDAR_MAIL_FROM: ${CALENDAR_MAIL_FROM:-calendar@localhost}
      CALENDAR_REMINDER_POLL_SECONDS: ${CALENDAR_REMINDER_POLL_SECONDS:-60}
      CALENDAR_WEBHOOK_URL: ${CALENDAR_WEBHOOK_URL:-http://host.docker.internal:8090/webhooks/calendar}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      calendar-db:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  calendar-pg:
